; ─────────────────────────────────────────────────────────────────────────────
;  aiameen.online — PHP hardening / limits
;  deploy.sh copies this to the active PHP conf.d directory.
; ─────────────────────────────────────────────────────────────────────────────

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/aiameen/php-error.log

date.timezone = UTC

memory_limit = 192M
max_execution_time = 30
post_max_size = 2M
upload_max_filesize = 2M
max_input_vars = 2000

; Do not rely on these for security, but keep sane sessions
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
